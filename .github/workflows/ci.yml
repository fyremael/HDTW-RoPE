name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  format-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install formatter
        run: python -m pip install ruff
      - name: Apply canonical formatting
        run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    needs: format-branch
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/hdtw_rope
      - name: Test
        run: pytest -q --cov=hdtw_rope --cov-report=term-missing

  smoke:
    needs: format-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Synthetic precompute
        run: hdtw-precompute-clocks --config configs/ci.yaml --output /tmp/hdtw-clocks.pt --batch-size 2
      - name: Synthetic train
        run: hdtw-train --config configs/ci.yaml --steps 1 --batch-size 2 --output-dir /tmp/hdtw-smoke
      - name: Synthetic evaluate
        run: hdtw-evaluate --config configs/ci.yaml --checkpoint /tmp/hdtw-smoke/checkpoint.pt --output /tmp/hdtw-eval.json --batch-size 2
