name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/hdtw_rope
      - name: Test
        run: pytest -q --cov=hdtw_rope --cov-report=term-missing

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Synthetic precompute
        run: hdtw-precompute-clocks --config configs/ci.yaml --output /tmp/hdtw-clocks.pt --batch-size 2
      - name: Synthetic train
        run: hdtw-train --config configs/ci.yaml --steps 1 --batch-size 2 --output-dir /tmp/hdtw-smoke
      - name: Synthetic evaluate
        run: hdtw-evaluate --config configs/ci.yaml --checkpoint /tmp/hdtw-smoke/checkpoint.pt --output /tmp/hdtw-eval.json --batch-size 2
