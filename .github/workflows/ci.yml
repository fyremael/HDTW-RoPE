name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Validate
        run: |
          python -m compileall -q src tests scripts
          ruff format --check .
          ruff check .
          mypy src/hdtw_rope
          pytest -q
